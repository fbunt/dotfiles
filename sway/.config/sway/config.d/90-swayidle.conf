# Idle and lock configuration
#
# This will lock your screen after 900 seconds of inactivity, then turn off
# your displays after another 300 seconds, and turn your screens back on when
# resumed. It will also lock your screen before your computer goes to sleep.
# On battery it also dims the screen to a third after 300 seconds, turns the
# displays off after 600, and after 1800 suspends, then hibernates (see
# HibernateDelaySec); on AC, or on machines without an AC adapter entry, none of
# the battery steps apply. Idle inhibitors (fullscreen video, mpv) keep it awake.
# The timeouts can be customized via `$lock_timeout` and `$screen_timeout`
# variables. For a predictable behavior, keep the `$screen_timeout` value
# lesser than the `$lock_timeout`.
#
# You can also lock the screen manually by running `loginctl lock-session` or
# add a binding for the command. Example:
#     bindsym $mod+Shift+Escape  exec loginctl lock-session
#
# Note that all swaylock customizations are handled via /etc/swaylock/config and
# can be overridden via $XDG_CONFIG_HOME/swaylock/config (~/.config/swaylock/config).
#
# Requires: swayidle
# Requires: swaylock
# Requires: /usr/bin/pkill, /usr/bin/pgrep

exec LT="$lock_timeout" ST="$screen_timeout" LT=${LT:-900} ST=${ST:-300} && \
    swayidle -w \
        timeout $LT 'swaylock -f' \
        timeout $((LT + ST)) 'swaymsg "output * power off"' \
                      resume 'swaymsg "output * power on"'  \
        timeout $ST 'pgrep -xu "$USER" swaylock >/dev/null && swaymsg "output * power off"' \
             resume 'pgrep -xu "$USER" swaylock >/dev/null && swaymsg "output * power on"'  \
        timeout 300 'grep -qx 0 /sys/class/power_supply/AC/online && brightnessctl -q -s set $(( $(brightnessctl g) / 3 )) && touch "$XDG_RUNTIME_DIR/swayidle-dimmed"' \
             resume 'rm "$XDG_RUNTIME_DIR/swayidle-dimmed" 2>/dev/null && brightnessctl -q -r' \
        timeout 600 'grep -qx 0 /sys/class/power_supply/AC/online && swaymsg "output * power off"' \
             resume 'swaymsg "output * power on"' \
        timeout 1800 'grep -qx 0 /sys/class/power_supply/AC/online && systemctl suspend-then-hibernate' \
        before-sleep 'swaylock -f' \
        lock 'swaylock -f' \
        unlock 'pkill -xu "$USER" -SIGUSR1 swaylock'
